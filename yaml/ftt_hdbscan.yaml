transform_list:
  # ----------------------------------------------------------------
  # standard proprocess: nan, label
  - nan:
      policy: mean # mean, median
  - label: {}
  # ----------------------------------------------------------------
  # numerical encoding process
  - num_cdf: 
      cdf_type: uniform # uniform, gaussian
      cache_path: fit_cache
      n_components: 100
      binning_method: hdbscan # quantile, hdbscan, hierarchical
  # ----------------------------------------------------------------
  # categorical encoding process
  - cat_onehot: {}
  # ----------------------------------------------------------------
  # normalization process
  - norm: 
      policy: standard # none, standard, minmax, robust, power, quantile, maxabs
  
model_type: 
  - ftt

model_path: results_model/ftt_hdbscan
seed: 1
seed_num: 15
gpu: 0
tune: true
n_trials: 20
