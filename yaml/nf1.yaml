transform_list:
  - nan:
      policy: mean # mean, median
  - label: {}
  - cat_indice: {}
  - norm:
      policy: standard 
  - nf: 
      expansion: false
      flow_layers: 6
      d_model: 1
      epochs: 100
      loss_cfg:
        nll: 1.0
        sample_cka: 0.0
        col_cka: 0.0
  - norm: 
      policy: standard # none, standard, minmax, robust, power, quantile, maxabs
   
model_type: 
  - mlp
  - resnet
  - mlp_plr
  - realmlp
  - ftt
  # - tab
  # - xgboost
  # - catboost

model_path: results_model/nf1
seed: 2025
seed_num: 15
gpu: 6
tune: true
n_trials: 100
load_tune_config: true
